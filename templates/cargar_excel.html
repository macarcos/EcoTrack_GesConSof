{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow border-0">
            <div class="card-header bg-primary text-white py-2 text-center">
                <h6 class="mb-0"><i class="bi bi-cloud-upload-fill"></i> Carga Masiva de Datos</h6>
            </div>
            <div class="card-body p-4">
                <p class="text-muted small text-center mb-4">
                    Sube un archivo Excel (.xlsx) para registrar múltiples consumos a la vez.
                </p>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label for="archivo" class="form-label fw-bold small text-secondary">Seleccionar Archivo</label>
                        <input type="file" class="form-control" name="archivo" accept=".xlsx, .xls" required>
                        <div class="form-text small text-muted fst-italic">
                            <i class="bi bi-info-circle"></i> Columnas requeridas: cedula, nombres, tipo, cantidad, fecha
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="bi bi-file-earmark-excel"></i> Procesar Archivo
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
